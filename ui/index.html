<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlunderBot UI</title>
    
    <!-- Chessboard.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <!-- Google Fonts for sleek typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<div class="container">
    <div class="header">
        <h1>BlunderBot</h1>
    </div>

    <div class="main-content">
        <!-- Play Area (Eval Bar + Board + Plates) -->
        <div class="play-area">
            <div class="player-plate top-plate">
                <div class="player-icon">🤖</div>
                <div class="player-info">
                    <span class="player-name">BlunderBot</span>
                    <span class="player-rating">Engine</span>
                </div>
            </div>
            
            <div class="board-eval-group">
                <div class="vertical-eval-wrapper">
                    <div id="eval-bar" class="vertical-eval-bar"></div>
                    <div id="eval-score" class="vertical-eval-score">0.00</div>
                </div>
                <div class="board-wrapper">
                    <div id="board" style="width: 100%"></div>
                    <!-- Game Over Overlay -->
                    <div id="game-over-overlay" class="game-over-overlay hidden">
                        <div id="game-over-title">Checkmate</div>
                        <div id="game-over-subtitle">White wins</div>
                    </div>
                    <!-- Promotion Modal -->
                    <div id="promotion-modal" class="promotion-modal hidden">
                        <div class="promotion-pieces" id="promotion-pieces-container">
                            <!-- Pieces injected via JS based on color -->
                        </div>
                    </div>
                </div>
            </div>

            <div class="player-plate bottom-plate">
                <div class="player-icon">♟️</div>
                <div class="player-info">
                    <span class="player-name">You</span>
                    <span class="player-rating">Human</span>
                </div>
            </div>
            
            <div class="controls">
                <select id="difficulty-select" class="difficulty-select">
                    <option value="2">Easy (Depth 2)</option>
                    <option value="4">Medium (Depth 4)</option>
                    <option value="6" selected>Hard (Depth 6)</option>
                </select>
                <button id="btn-reset">Reset Board</button>
                <button id="btn-engine">Force Move</button>
            </div>
        </div>
        
        <!-- Live HUD & Stats -->
        <div class="hud">
            <div class="hud-header">Engine Telemetry</div>

            <div class="stats-grid">
                <div class="stat-group">
                    <div class="stat-label">DEPTH</div>
                    <div id="stat-depth" class="stat-value">0</div>
                </div>
                <div class="stat-group">
                    <div class="stat-label">NODES</div>
                    <div id="stat-nodes" class="stat-value">0</div>
                </div>
                <div class="stat-group">
                    <div class="stat-label">BEST MOVE</div>
                    <div id="stat-bestmove" class="stat-value">-</div>
                </div>
                <div class="stat-group">
                    <div class="stat-label">NPS</div>
                    <div id="stat-nps" class="stat-value">-</div>
                </div>
            </div>
            
            <div class="console">
                <div class="console-header">Raw Output</div>
                <div id="console-output" class="console-output"></div>
            </div>
        </div>
    </div>
</div>

<!-- Libraries -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<!-- App Logic -->
<script src="app.js?v=2"></script>
</body>
</html>
