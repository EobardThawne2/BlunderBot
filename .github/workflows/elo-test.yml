name: Elo Regression Test

on:
  pull_request:
    branches: [ "main" ]

jobs:
  elo-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout PR branch
      uses: actions/checkout@v4
      with:
        path: pr-branch

    - name: Checkout Main branch
      uses: actions/checkout@v4
      with:
        ref: main
        path: main-branch

    - name: Build PR Engine
      run: |
        cd pr-branch
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release
        mv build/BlunderBot ../BlunderBot-pr
        cp nn-62ef826d1a6d.nnue ../

    - name: Build Main Engine
      run: |
        cd main-branch
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release
        mv build/BlunderBot ../BlunderBot-main

    - name: Install Cutechess
      run: |
        sudo apt-get update
        sudo apt-get install -y cutechess-cli

    - name: Run Match
      run: |
        # Play 100 games at 1s + 0.1s increment
        cutechess-cli \
          -engine cmd=./BlunderBot-pr name=PR-Version \
          -engine cmd=./BlunderBot-main name=Main-Version \
          -each proto=uci tc=1+0.1 \
          -games 100 -rounds 50 -repeat \
          -concurrency 4 \
          -pgnout match.pgn || true
        
        # Output the results so they appear in GitHub Actions logs
        cat match.pgn
