name: Elo Regression Test

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/elo-test.yml'
      - 'tests/**'
  workflow_dispatch:

jobs:
  elo-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Baseline (All Off)"
            options: "option.UseSEE=false option.UseSingularExtensions=false option.UseCountermove=false option.UseProbCut=false"
          - name: "Only SEE"
            options: "option.UseSEE=true option.UseSingularExtensions=false option.UseCountermove=false option.UseProbCut=false"
          - name: "Only Singular Extensions"
            options: "option.UseSEE=false option.UseSingularExtensions=true option.UseCountermove=false option.UseProbCut=false"
          - name: "Only Countermove"
            options: "option.UseSEE=false option.UseSingularExtensions=false option.UseCountermove=true option.UseProbCut=false"
          - name: "Only ProbCut"
            options: "option.UseSEE=false option.UseSingularExtensions=false option.UseCountermove=false option.UseProbCut=true"

    steps:
    - name: Checkout PR branch
      uses: actions/checkout@v4
      with:
        path: pr-branch

    - name: Checkout Main branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.before }}
        path: main-branch

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ubuntu-latest-ccache-${{ github.ref }}
        restore-keys: |
          ubuntu-latest-ccache-

    - name: Build PR Engine
      run: |
        cd pr-branch
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        cmake --build build --config Release
        if [ -f build/make_book ]; then build/make_book data/openings.txt blunderbot_book.bin; cp blunderbot_book.bin ../; fi
        mv build/BlunderBot ../BlunderBot-pr
        cp nn-62ef826d1a6d.nnue ../

    - name: Build Main Engine
      run: |
        cd main-branch
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        cmake --build build --config Release
        if [ -f build/make_book ]; then build/make_book data/openings.txt blunderbot_book_main.bin; cp blunderbot_book_main.bin ../blunderbot_book.bin; fi
        mv build/BlunderBot ../BlunderBot-main

    - name: Install Match Runner
      run: |
        git clone https://github.com/lucasart/c-chess-cli.git
        cd c-chess-cli
        python3 make.py
        sudo mv c-chess-cli /usr/local/bin/cutechess-cli

    - name: Run Match - ${{ matrix.name }}
      run: |
        # Play games using SPRT (Sequential Probability Ratio Test)
        # elo0=0, elo1=10: fails if PR is worse, passes if equal or better
        cutechess-cli \
          -engine cmd=./BlunderBot-pr name="PR-Version (${{ matrix.name }})" ${{ matrix.options }} \
          -engine cmd=./BlunderBot-main name=Main-Version \
          -each tc=0:10+0.1 option.Threads=1 \
          -rounds 250 -games 2 -repeat \
          -sprt elo0=-10 elo1=0 alpha=0.05 beta=0.05 \
          -concurrency 4 > cutechess.out || true
        
        # Display the full output for logs
        cat cutechess.out
        
        # Run the parser to determine if SPRT failed
        python3 pr-branch/tests/parse_elo.py cutechess.out
